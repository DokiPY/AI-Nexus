# AI-Nexus - nexus.berivena.com

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name nexus.berivena.com;

    # certbot 续期验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name nexus.berivena.com;

    ssl_certificate /etc/letsencrypt/live/nexus.berivena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.berivena.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 增大 proxy buffer，避免大 JS/CSS 文件写临时文件
    proxy_buffer_size 16k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;

    # 前端
    location / {
        proxy_pass http://ai-nexus-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 直接到后端
    location /api/v1/ {
        proxy_pass http://ai-nexus-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
