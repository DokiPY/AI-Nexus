# docker-compose.yml
# ============================================
# 用法:
#   docker compose --env-file .env.production up -d --build
#   docker compose --env-file .env.staging up -d --build
# ============================================

services:
  backend:
    container_name: ai-nexus-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 不对外暴露端口，只通过 nginx-proxy 网络访问
    expose:
      - "8000"
    environment:
      - ENV=${ENV:-production}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-ai_agent_platform}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    networks:
      - ai-nexus
      - nginx-proxy

  frontend:
    container_name: ai-nexus-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ENV: ${VITE_ENV:-production}
    # 不对外暴露端口，只通过 nginx-proxy 网络访问
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-nexus
      - nginx-proxy

networks:
  ai-nexus:
    driver: bridge
  nginx-proxy:
    external: true
